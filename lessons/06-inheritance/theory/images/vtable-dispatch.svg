<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="670" viewBox="0 0 1160 670" role="img"><title>Указатель → объект → таблица → код</title><desc>Два объекта Circle имеют собственные данные и vptr на общую таблицу. В таблице name ведёт к Circle name, category — к Shape category. Rectangle ведёт к другой таблице и другой реализации name.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#cbd5e1" stroke-width="1"/></pattern></defs><rect width="1160" height="670" rx="14" fill="#f8fafc"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="start">Указатель → объект → таблица → код</text><text x="25" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Shape* p</text><circle cx="98" cy="130" r="5" fill="#4f46e5"/><path d="M103,130 L208,146" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="220" y="90" width="260" height="135" rx="8" fill="white" stroke="#94a3b8" stroke-width="2"/><text x="232" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="start">circle1: Circle</text><rect x="230" y="126" width="240" height="64" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="242" y="149" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">Shape: vptr</text><circle cx="455" cy="146" r="5" fill="#4f46e5"/><text x="242" y="175" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">id_ = 7</text><text x="242" y="215" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">radius_ = 2.0</text><rect x="220" y="275" width="260" height="135" rx="8" fill="white" stroke="#94a3b8" stroke-width="2"/><text x="232" y="300" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="start">circle2: Circle</text><rect x="230" y="311" width="240" height="64" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="242" y="334" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">Shape: vptr</text><circle cx="455" cy="331" r="5" fill="#4f46e5"/><text x="242" y="360" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">id_ = 8</text><text x="242" y="400" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">radius_ = 4.0</text><text x="25" y="485" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Shape* q</text><circle cx="98" cy="503" r="5" fill="#4f46e5"/><path d="M103,503 L208,506" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="220" y="450" width="260" height="162" rx="8" fill="white" stroke="#94a3b8" stroke-width="2"/><text x="232" y="475" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="start">rect: Rectangle</text><rect x="230" y="486" width="240" height="64" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="242" y="509" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">Shape: vptr</text><circle cx="455" cy="506" r="5" fill="#4f46e5"/><text x="242" y="535" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">id_ = 9</text><text x="242" y="575" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">width_ = 3.0</text><text x="242" y="602" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">height_ = 4.0</text><rect x="615" y="120" width="235" height="130" rx="8" fill="#ede9fe" stroke="#94a3b8" stroke-width="2"/><text x="627" y="148" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="start">vtable Circle</text><path d="M615,162 L850,162" stroke="#64748b" stroke-width="2" fill="none"/><path d="M615,205 L850,205" stroke="#64748b" stroke-width="2" fill="none"/><text x="630" y="191" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#172033" text-anchor="start">name</text><circle cx="831" cy="185" r="5" fill="#4f46e5"/><text x="630" y="234" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#172033" text-anchor="start">category</text><circle cx="831" cy="228" r="5" fill="#4f46e5"/><rect x="615" y="460" width="235" height="130" rx="8" fill="#ede9fe" stroke="#94a3b8" stroke-width="2"/><text x="627" y="488" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="start">vtable Rectangle</text><path d="M615,502 L850,502" stroke="#64748b" stroke-width="2" fill="none"/><path d="M615,545 L850,545" stroke="#64748b" stroke-width="2" fill="none"/><text x="630" y="531" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#172033" text-anchor="start">name</text><circle cx="831" cy="525" r="5" fill="#4f46e5"/><text x="630" y="574" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#172033" text-anchor="start">category</text><circle cx="831" cy="568" r="5" fill="#4f46e5"/><path d="M455,146 L535,146 L535,162 L607,162" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M455,331 L555,331 L555,162 L607,162" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M455,506 L607,506" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="930" y="145" width="205" height="70" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="942" y="172" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="start">Circle::name</text><text x="942" y="198" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">→ &quot;circle&quot;</text><rect x="930" y="325" width="205" height="70" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="942" y="352" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="start">Shape::category</text><text x="942" y="378" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">→ &quot;geometry&quot;</text><rect x="930" y="485" width="205" height="70" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="942" y="512" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="start">Rectangle::name</text><text x="942" y="538" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">→ &quot;rectangle&quot;</text><path d="M836,185 L922,180" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M836,228 L885,228 L885,348 L922,348" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M836,525 L922,520" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M836,568 L905,568 L905,374 L922,374" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="25" y="645" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Данные — у каждого объекта. Таблица и код методов — общие для объектов класса.</text></svg>
