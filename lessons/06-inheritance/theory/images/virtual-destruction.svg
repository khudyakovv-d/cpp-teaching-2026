<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="465" viewBox="0 0 1160 465" role="img"><title>Уничтожение: тело наследника → поле → база → память</title><desc>Пять состояний одного динамического объекта. После тела Derived destructor база и поле ещё живы. Затем уничтожено поле Resource, затем Base, и только потом освобождена память. Выбор начала обеспечивается виртуальным деструктором.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#cbd5e1" stroke-width="1"/></pattern></defs><rect width="1160" height="465" rx="14" fill="#f8fafc"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="start">Уничтожение: тело наследника → поле → база → память</text><text x="126" y="95" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">до удаления</text><rect x="30" y="120" width="192" height="245" rx="8" fill="white" stroke="#94a3b8" stroke-width="2"/><text x="42" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Derived</text><rect x="42" y="168" width="168" height="65" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="55" y="194" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033" text-anchor="start">Base</text><text x="55" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033" text-anchor="start">vptr</text><rect x="42" y="248" width="168" height="85" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="55" y="277" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="start">resource_</text><text x="55" y="306" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">Resource</text><path d="M225,380 L254,380" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="240" y="412" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">1</text><text x="354" y="95" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">после тела ~Derived</text><rect x="258" y="120" width="192" height="245" rx="8" fill="white" stroke="#94a3b8" stroke-width="2"/><text x="270" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Derived</text><rect x="270" y="168" width="168" height="65" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="283" y="194" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033" text-anchor="start">Base</text><text x="283" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033" text-anchor="start">vptr</text><rect x="270" y="248" width="168" height="85" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="283" y="277" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="start">resource_</text><text x="283" y="306" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">Resource</text><path d="M453,380 L482,380" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="468" y="412" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">2</text><text x="582" y="95" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">после ~Resource</text><rect x="486" y="120" width="192" height="245" rx="8" fill="white" stroke="#94a3b8" stroke-width="2"/><text x="498" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Derived</text><rect x="498" y="168" width="168" height="65" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="511" y="194" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033" text-anchor="start">Base</text><text x="511" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033" text-anchor="start">vptr</text><rect x="498" y="248" width="168" height="85" rx="8" fill="#e5e7eb" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="511" y="277" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="start">resource_</text><text x="511" y="306" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">Resource</text><path d="M618,279 L644,305" stroke="#dc2626" stroke-width="2" fill="none"/><path d="M618,305 L644,279" stroke="#dc2626" stroke-width="2" fill="none"/><path d="M681,380 L710,380" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="696" y="412" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">3</text><text x="810" y="95" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">после ~Base</text><rect x="714" y="120" width="192" height="245" rx="8" fill="white" stroke="#94a3b8" stroke-width="2"/><text x="726" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Derived</text><rect x="726" y="168" width="168" height="65" rx="8" fill="#e5e7eb" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="739" y="194" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033" text-anchor="start">Base</text><text x="739" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033" text-anchor="start">vptr</text><rect x="726" y="248" width="168" height="85" rx="8" fill="#e5e7eb" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="739" y="277" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="start">resource_</text><text x="739" y="306" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">Resource</text><path d="M846,279 L872,305" stroke="#dc2626" stroke-width="2" fill="none"/><path d="M846,305 L872,279" stroke="#dc2626" stroke-width="2" fill="none"/><path d="M846,190 L872,216" stroke="#dc2626" stroke-width="2" fill="none"/><path d="M846,216 L872,190" stroke="#dc2626" stroke-width="2" fill="none"/><path d="M909,380 L938,380" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="924" y="412" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">4</text><text x="1038" y="95" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">память свободна</text><rect x="942" y="120" width="192" height="245" rx="8" fill="url(#hatch)" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><path d="M1013,210 L1063,260" stroke="#dc2626" stroke-width="2" fill="none"/><path d="M1013,260 L1063,210" stroke="#dc2626" stroke-width="2" fill="none"/><text x="30" y="449" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">При delete через Base* виртуальный деструктор выбирает начало: ~Derived.</text></svg>
