<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="330" viewBox="0 0 1160 330" role="img"><title>Переопределяется отдельная запись таблицы</title><desc>Две таблицы с выровненными слотами. В Circle изменена запись name, а category по-прежнему указывает на Shape category. Символические слоты, служебные записи опущены.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#cbd5e1" stroke-width="1"/></pattern></defs><rect width="1160" height="330" rx="14" fill="#f8fafc"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="start">Переопределяется отдельная запись таблицы</text><rect x="30" y="80" width="510" height="200" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="50" y="112" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033" text-anchor="start">vtable Shape</text><path d="M30,130 L540,130" stroke="#64748b" stroke-width="2" fill="none"/><path d="M30,205 L540,205" stroke="#64748b" stroke-width="2" fill="none"/><text x="50" y="176" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">name</text><text x="205" y="176" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033" text-anchor="start">Shape::name()</text><text x="50" y="250" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">category</text><text x="205" y="250" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033" text-anchor="start">Shape::category()</text><rect x="620" y="80" width="510" height="200" rx="8" fill="#ede9fe" stroke="#94a3b8" stroke-width="2"/><text x="640" y="112" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033" text-anchor="start">vtable Circle</text><path d="M620,130 L1130,130" stroke="#64748b" stroke-width="2" fill="none"/><path d="M620,205 L1130,205" stroke="#64748b" stroke-width="2" fill="none"/><text x="640" y="176" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">name</text><text x="795" y="176" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033" text-anchor="start">Circle::name()</text><text x="640" y="250" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">category</text><text x="795" y="250" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033" text-anchor="start">Shape::category()</text><path d="M543,170 L611,170" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="578" y="151" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="middle">≠</text><path d="M545,245 L607,245" stroke="#64748b" stroke-width="2" fill="none"/><text x="578" y="235" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033" text-anchor="middle">=</text></svg>
