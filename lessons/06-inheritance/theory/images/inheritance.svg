<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img"><title>UML: наследование</title><desc>Два класса: Circle и базовый Shape. Сплошная линия с пустым треугольником направлена от Circle к Shape. Композиция на этой схеме не показана.</desc><defs><marker id="general" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="#475569" stroke-width="1.4"/></marker><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#475569"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#475569" stroke-width="1.4"/></marker></defs><rect width="760" height="560" fill="#f8fafc"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#172033">UML: наследование</text><rect x="205" y="75" width="350" height="198" fill="white" stroke="#475569" stroke-width="1.7"/><text x="380.0" y="108" font-family="Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" text-anchor="middle" fill="#172033">Shape</text><path d="M205,125 L555,125" fill="none" stroke="#475569" stroke-width="1.7"/><text x="221" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#172033">- id_: int</text><path d="M205,171 L555,171" fill="none" stroke="#475569" stroke-width="1.7"/><text x="221" y="201" font-family="Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#172033">+ id(): int</text><text x="221" y="229" font-family="Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#172033">+ name(): string_view</text><text x="221" y="257" font-family="Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text