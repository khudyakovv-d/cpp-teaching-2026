<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="485" viewBox="0 0 1160 485" role="img"><title>UML: иерархия исключений</title><desc>Диаграмма классов: незакрашенные треугольники направлены к базовым классам. InvalidShape наследует runtime_error, runtime_error наследует exception. Вторая ветвь: length_error, logic_error, exception.</desc><defs><marker id="general" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="#475569" stroke-width="1.4"/></marker><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#475569"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#475569" stroke-width="1.4"/></marker></defs><rect width="1160" height="485" fill="#f8fafc"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#172033">UML: иерархия исключений</text><rect x="425" y="75" width="310" height="96" fill="white" stroke="#475569" stroke-width="1.7"/><text x="580.0" y="108" font-family="Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" text-anchor="middle" fill="#172033">std::exception</text><path d="M425,125 L735,125" fill="none" stroke="#475569" stroke-width="1.7"/><text x="441" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#172033">+ what(): const char*</text><rect x="120" y="260" width="330" height="50" fill="white" stroke="#475569" stroke-width="1.7"/><text x="285.0" y="293" font-family="Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" text-anchor="middle" fill="#172033">std::runtime_error</text><rect x="710" y="260" width="330" height="50" fill="white" stroke="#475569" stroke-width="1.7"/><text x="875.0" y="293" font-family="Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" text-anchor="middle" fill="#172033">std::logic_error</text><path d="M285,260 L285,220 L580,220" fill="none" stroke="#475569" stroke-width="1.7"/><path d="M875,260 L875,220 L580,220" fill="none" stroke="#475569" stroke-width="1.7"/><path d="M580,220 L580,173" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#general)"/><rect x="120" y="405" width="330" height="50" fill="white" stroke="#475569" stroke-width="1.7"/><text x="285.0" y="438" font-family="Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" text-anchor="middle" fill="#172033">InvalidShape</text><path d="M285,405 L285,312" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#general)"/><rect x="710" y="405" width="330" height="50" fill="white" stroke="#475569" stroke-width="1.7"/><text x="875.0" y="438" font-family="Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" text-anchor="middle" fill="#172033">std::length_error</text><path d="M875,405 L875,312" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#general)"/></svg>
