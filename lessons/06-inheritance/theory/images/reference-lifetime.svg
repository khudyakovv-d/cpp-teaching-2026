<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="450" viewBox="0 0 1160 450" role="img"><title>Время жизни объекта и базовой ссылки</title><desc>Объект Derived живёт от объявления до конца области видимости. Ссылка существует только во время inspect и обозначает тот же объект. После возврата из inspect объект продолжает жить. В конце области видимости идут Derived destructor и Base destructor.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#cbd5e1" stroke-width="1"/></pattern></defs><rect width="1160" height="450" rx="14" fill="#f8fafc"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="start">Время жизни объекта и базовой ссылки</text><path d="M180,92 L1120,92" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1070" y="77" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">время</text><text x="25" y="184" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">object:</text><text x="25" y="211" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Derived</text><text x="25" y="297" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">ref:</text><text x="25" y="324" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Base&amp;</text><rect x="180" y="155" width="820" height="70" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><rect x="430" y="270" width="250" height="70" rx="8" fill="#ede9fe" stroke="#94a3b8" stroke-width="2"/><path d="M555,267 L555,230" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="575" y="251" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">тот же объект</text><path d="M180,105 L180,355" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="180" y="382" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">создание</text><path d="M430,105 L430,355" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="430" y="382" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">вход в inspect</text><path d="M680,105 L680,355" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="680" y="382" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">возврат</text><path d="M1000,105 L1000,355" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="1000" y="382" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">конец области</text><path d="M989,179 L1011,201" stroke="#dc2626" stroke-width="2" fill="none"/><path d="M989,201 L1011,179" stroke="#dc2626" stroke-width="2" fill="none"/><text x="835" y="422" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">~Derived() → ~Base()</text></svg>
