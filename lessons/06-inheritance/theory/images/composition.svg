<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img"><title>UML: композиция</title><desc>Circle владеет одним Point по роли center. Закрашенный ромб стоит у Circle. Кратность у обоих концов равна 1. Наследование на этой схеме не показано.</desc><defs><marker id="general" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="#475569" stroke-width="1.4"/></marker><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#475569"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#475569" stroke-width="1.4"/></marker></defs><rect width="1000" height="300" fill="#f8fafc"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#172033">UML: композиция</text><rect x="50" y="85" width="270" height="142" fill="white" stroke="#475569" stroke-width="1.7"/><text x="185.0" y="118" font-family="Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" text-anchor="middle" fill="#172033">Circle</text><path d="M50,135 L320,135" fill="none" stroke="#475569" stroke-width="1.7"/><text x="66" y="165" font-family="Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#172033">- radius_: double</text><path d="M50,181 L320,181" fill="none" stroke="#475569" stroke-width="1.7"/><text x="66" y="211" font-family="Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#172033">+ radius(): double</text><rect x="700" y="85" width="250" height="124" fill="white" stroke="#475569" stroke-width="1.7"/><text x="825.0" y="118" font-family="Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" text-anchor="middle" fill="#172033">Point</text><path d="M700,135 L950,135" fill="none" stroke="#475569" stroke-width="1.7"/><text x="716" y="165" font-family="Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#172033">+ x: double</text><text x="716" y="193" font-family="Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#172033">+ y: double</text><path d="M320,150 L336,141 L352,150 L336,159 Z" fill="#475569" stroke="#475569"/><path d="M352,150 L700,150" fill="none" stroke="#475569" stroke-width="1.7"/><text x="375" y="139" font-family="Arial, sans-serif" font-size="19" font-weight="400" font-style="normal" text-anchor="start" fill="#172033">1</text><text x="675" y="139" font-family="Arial, sans-serif" font-size="19" font-weight="400" font-style="normal" text-anchor="start" fill="#172033">1</text><text x="590" y="181" font-family="Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#172033">- center_</text><text x="28" y="280" font-family="Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#172033">Point center_;</text></svg>
