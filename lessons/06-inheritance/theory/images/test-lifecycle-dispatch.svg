<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="750" viewBox="0 0 1160 750" role="img"><title>UML: вызовы при запуске теста</title><desc>Диаграмма последовательности. Линия жизни test PreparedTest одна. Код main вызывает Run. Run последовательно вызывает на том же объекте SetUp, TestBody и TearDown. Вложенные прямоугольники — выполнения методов. Закрашенные стрелки обозначают синхронные вызовы, пунктирные — возвраты.</desc><defs><marker id="general" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="#475569" stroke-width="1.4"/></marker><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#475569"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#475569" stroke-width="1.4"/></marker></defs><rect width="1160" height="750" fill="#f8fafc"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#172033">UML: вызовы при запуске теста</text><rect x="65" y="75" width="170" height="55" fill="white" stroke="#475569" stroke-width="1.7"/><text x="150" y="110" font-family="Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" text-anchor="middle" fill="#172033">main</text><rect x="500" y="75" width="290" height="55" fill="white" stroke="#475569" stroke-width="1.7"/><text x="645" y="110" font-family="Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" text-anchor="middle" fill="#172033">test: PreparedTest</text><path d="M150,130 L150,710" fill="none" stroke="#475569" stroke-width="1.7" stroke-dasharray="7 5"/><path d="M645,130 L645,710" fill="none" stroke="#475569" stroke-width="1.7" stroke-dasharray="7 5"/><rect x="140" y="175" width="20" height="510" fill="#e0f2fe" stroke="#475569" stroke-width="1.7"/><rect x="635" y="185" width="20" height="475" fill="#e0f2fe" stroke="#475569" stroke-width="1.7"/><path d="M160,185 L633,185" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#call)"/><text x="365" y="173" font-family="Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" text-anchor="middle" fill="#172033">Run()</text><rect x="645" y="265" width="20" height="45" fill="#dcfce7" stroke="#475569" stroke-width="1.7"/><path d="M655,230 L855,230 L855,265 L667,265" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#call)"/><text x="745" y="220" font-family="Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" text-anchor="middle" fill="#172033">SetUp()</text><path d="M667,310 L855,310 L855,330 L657,330" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#reply)" stroke-dasharray="7 5"/><text x="880" y="294" font-family="Arial, sans-serif" font-size="19" font-weight="400" font-style="normal" text-anchor="start" fill="#172033">PreparedTest::SetUp</text><rect x="645" y="400" width="20" height="45" fill="#dcfce7" stroke="#475569" stroke-width="1.7"/><path d="M655,365 L855,365 L855,400 L667,400" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#call)"/><text x="745" y="355" font-family="Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" text-anchor="middle" fill="#172033">TestBody()</text><path d="M667,445 L855,445 L855,465 L657,465" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#reply)" stroke-dasharray="7 5"/><text x="880" y="429" font-family="Arial, sans-serif" font-size="19" font-weight="400" font-style="normal" text-anchor="start" fill="#172033">PreparedTest::TestBody</text><rect x="645" y="535" width="20" height="45" fill="#dcfce7" stroke="#475569" stroke-width="1.7"/><path d="M655,500 L855,500 L855,535 L667,535" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#call)"/><text x="745" y="490" font-family="Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" text-anchor="middle" fill="#172033">TearDown()</text><path d="M667,580 L855,580 L855,600 L657,600" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#reply)" stroke-dasharray="7 5"/><text x="880" y="564" font-family="Arial, sans-serif" font-size="19" font-weight="400" font-style="normal" text-anchor="start" fill="#172033">Test::TearDown</text><path d="M633,660 L162,660" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#reply)" stroke-dasharray="7 5"/><text x="28" y="732" font-family="Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#172033">Время идёт сверху вниз; все три этапа выполняются на одном объекте test.</text></svg>
