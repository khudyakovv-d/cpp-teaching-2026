<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="475" viewBox="0 0 1160 475" role="img"><title>Как меняется объект во время создания и уничтожения</title><desc>Четыре стадии. В Base constructor производная часть ещё не создана; в Derived constructor и destructor она активна; в Base destructor производная часть уже уничтожена. Указатель таблицы соответствует текущей стадии.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#cbd5e1" stroke-width="1"/></pattern></defs><rect width="1160" height="475" rx="14" fill="#f8fafc"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="start">Как меняется объект во время создания и уничтожения</text><text x="150" y="89" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033" text-anchor="middle">Base()</text><rect x="30" y="115" width="245" height="180" rx="8" fill="white" stroke="#94a3b8" stroke-width="2"/><rect x="42" y="127" width="221" height="65" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="55" y="153" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="start">часть Base</text><text x="55" y="178" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">vptr</text><circle cx="222" cy="173" r="5" fill="#4f46e5"/><rect x="42" y="205" width="221" height="75" rx="8" fill="url(#hatch)" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="55" y="232" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="start">часть Derived</text><text x="55" y="259" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">ещё нет</text><path d="M222,173 L288,173 L288,330 L152,330 L152,346" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="355" width="245" height="65" rx="8" fill="#ede9fe" stroke="#94a3b8" stroke-width="2"/><text x="152" y="382" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">printName</text><text x="152" y="407" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">→ Base::printName</text><path d="M277,88 L304,88" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="435" y="89" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033" text-anchor="middle">Derived()</text><rect x="315" y="115" width="245" height="180" rx="8" fill="white" stroke="#94a3b8" stroke-width="2"/><rect x="327" y="127" width="221" height="65" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="340" y="153" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="start">часть Base</text><text x="340" y="178" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">vptr</text><circle cx="507" cy="173" r="5" fill="#4f46e5"/><rect x="327" y="205" width="221" height="75" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="340" y="232" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="start">часть Derived</text><text x="340" y="259" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">готова</text><path d="M507,173 L573,173 L573,330 L437,330 L437,346" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="315" y="355" width="245" height="65" rx="8" fill="#ede9fe" stroke="#94a3b8" stroke-width="2"/><text x="437" y="382" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">printName</text><text x="437" y="407" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">→ Derived::printName</text><path d="M562,88 L589,88" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="720" y="89" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033" text-anchor="middle">~Derived()</text><rect x="600" y="115" width="245" height="180" rx="8" fill="white" stroke="#94a3b8" stroke-width="2"/><rect x="612" y="127" width="221" height="65" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="625" y="153" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="start">часть Base</text><text x="625" y="178" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">vptr</text><circle cx="792" cy="173" r="5" fill="#4f46e5"/><rect x="612" y="205" width="221" height="75" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="625" y="232" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="start">часть Derived</text><text x="625" y="259" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">жива в теле</text><path d="M792,173 L858,173 L858,330 L722,330 L722,346" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="600" y="355" width="245" height="65" rx="8" fill="#ede9fe" stroke="#94a3b8" stroke-width="2"/><text x="722" y="382" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">printName</text><text x="722" y="407" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">→ Derived::printName</text><path d="M847,88 L874,88" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1005" y="89" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033" text-anchor="middle">~Base()</text><rect x="885" y="115" width="245" height="180" rx="8" fill="white" stroke="#94a3b8" stroke-width="2"/><rect x="897" y="127" width="221" height="65" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="910" y="153" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="start">часть Base</text><text x="910" y="178" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">vptr</text><circle cx="1077" cy="173" r="5" fill="#4f46e5"/><rect x="897" y="205" width="221" height="75" rx="8" fill="url(#hatch)" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="910" y="232" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="start">часть Derived</text><text x="910" y="259" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start">уже нет</text><path d="M1077,173 L1143,173 L1143,330 L1007,330 L1007,346" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="885" y="355" width="245" height="65" rx="8" fill="#ede9fe" stroke="#94a3b8" stroke-width="2"/><text x="1007" y="382" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">printName</text><text x="1007" y="407" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">→ Base::printName</text><text x="30" y="458" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Штриховка: производная часть ещё не создана или уже уничтожена.</text></svg>
