<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img"><title>TEST_F: каждому тесту — своя фикстура</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1000" height="310" rx="16" fill="#f8fafc"/><text x="32" y="42" font-family="Arial, sans-serif" font-size="26" fill="#172033" font-weight="700">TEST_F: каждому тесту — своя фикстура</text><text x="32" y="124" font-family="Arial, sans-serif" font-size="20" fill="#172033" font-weight="700">Тест A</text><rect x="145" y="93" width="220" height="55" rx="12" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="2"/><text x="159" y="128" font-family="Arial, sans-serif" font-size="19" fill="#172033" font-weight="400">Новый экземпляр</text><rect x="400" y="93" width="135" height="55" rx="12" fill="#ede9fe" stroke="#cbd5e1" stroke-width="2"/><text x="414" y="128" font-family="Arial, sans-serif" font-size="19" fill="#172033" font-weight="400">SetUp()</text><rect x="570" y="93" width="150" height="55" rx="12" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/><text x="584" y="128" font-family="Arial, sans-serif" font-size="19" fill="#172033" font-weight="400">Тело теста</text><rect x="755" y="93" width="210" height="55" rx="12" fill="#ffedd5" stroke="#cbd5e1" stroke-width="2"/><text x="769" y="128" font-family="Arial, sans-serif" font-size="19" fill="#172033" font-weight="400">Очистка¹</text><path d="M367,120 L392,120" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M537,120 L562,120" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M722,120 L747,120" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="219" font-family="Arial, sans-serif" font-size="20" fill="#172033" font-weight="700">Тест B</text><rect x="145" y="188" width="220" height="55" rx="