<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="325" viewBox="0 0 1000 325" role="img"><title>Как проверить независимость копии</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1000" height="325" rx="16" fill="#f8fafc"/><text x="32" y="42" font-family="Arial, sans-serif" font-size="26" fill="#172033" font-weight="700">Как проверить независимость копии</text><rect x="32" y="85" width="420" height="160" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="54" y="123" font-family="Arial, sans-serif" font-size="22" fill="#172033" font-weight="700">До изменения копии</text><text x="54" y="170" font-family="Arial, sans-serif" font-size="24" fill="#172033" font-weight="400">original: [7, −3]</text><text x="54" y="213" font-family="Arial, sans-serif" font-size="24" fill="#172033" font-weight="400">copy:     [7, −3]</text><rect x="540" y="85" width="420" height="160" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="562" y="123" font-family="Arial, sans-serif" font-size="22" fill="#172033" font-weight="700">После copy[0] = 99</text><text x="562" y="170" font-family="Arial, sans-serif" font-size="24" fill="#172033" font-weight="400">original: [7, −3]</text><text x="562" y="213" font-family="Arial, sans-serif" font-size="24" fill="#172033" font-weight="400">copy:     [99, −3]</text><path d="M464,163 L528,163" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="288" font-family="Arial, sans-serif" font-size="23" fill="#166534" font-weight="700">Ожидание: изменение copy не меняет original.</text></svg>