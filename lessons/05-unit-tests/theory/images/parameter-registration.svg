<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="355" viewBox="0 0 1000 355" role="img"><title>Один сценарий × четыре параметра = четыре теста</title><rect width="1000" height="355" rx="16" fill="#f8fafc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="none" stroke="#64748b"/></marker></defs><text x="30" y="42" font-family="Arial, sans-serif" font-size="25" fill="#172033" font-weight="700">Один сценарий × четыре параметра = четыре теста</text><rect x="30" y="80" width="290" height="112" rx="12" fill="#e0f2fe"/><text x="46" y="112" font-family="Arial, sans-serif" font-size="21" fill="#172033" font-weight="700">TEST_P</text><text x="46" y="145" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">Образец сценария</text><text x="46" y="173" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">PreservesRequestedSize</text><path d="M325,136 L346,136" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="355" y="80" width="290" height="112" rx="12" fill="#ede9fe"/><text x="371" y="112" font-family="Arial, sans-serif" font-size="21" fill="#172033" font-weight="700">INSTANTIATE…</text><text x="371" y="145" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">Группа ValidSizes</text><text x="371" y="173" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">Входы: 0, 1, 2, 5</text><path d="M650,136 L671,136" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="680" y="80" width="290" height="112" rx="12" fill="#dcfce7"/><text x="696" y="112" font-family="Arial, sans-serif" font-size="21" fill="#172033" font-weight="700">Инициализация gtest</text><text x="696" y="145" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">Соединяет тело и данные</text><text x="696" y="173" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">Создаёт отдельные тесты</text><text x="30" y="232" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">ValidSizes/VectorSizeTest.PreservesRequestedSize/0 → параметр 0</text><text x="30" y="260" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">ValidSizes/VectorSizeTest.PreservesRequestedSize/1 → параметр 1</text><text x="30" y="288" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">ValidSizes/VectorSizeTest.PreservesRequestedSize/2 → параметр 2</text><text x="30" y="316" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">ValidSizes/VectorSizeTest.PreservesRequestedSize/3 → параметр 5</text></svg>