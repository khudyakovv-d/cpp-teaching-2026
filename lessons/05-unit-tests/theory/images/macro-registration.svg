<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img"><title>Объявление теста и его запуск</title><rect width="1000" height="270" rx="16" fill="#f8fafc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="none" stroke="#64748b"/></marker></defs><text x="30" y="42" font-family="Arial, sans-serif" font-size="25" fill="#172033" font-weight="700">Объявление теста и его запуск</text><rect x="30" y="80" width="290" height="112" rx="12" fill="#e0f2fe"/><text x="46" y="112" font-family="Arial, sans-serif" font-size="21" fill="#172033" font-weight="700">Макрос TEST</text><text x="46" y="145" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">Создаёт класс теста</text><text x="46" y="173" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">и код регистрации</text><path d="M325,136 L346,136" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="355" y="80" width="290" height="112" rx="12" fill="#ede9fe"/><text x="371" y="112" font-family="Arial, sans-serif" font-size="21" fill="#172033" font-weight="700">Запуск программы</text><text x="371" y="145" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">Регистрация до main</text><text x="371" y="173" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">Список известных тестов</text><path d="M650,136 L671,136" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="680" y="80" width="290" height="112" rx="12" fill="#dcfce7"/><text x="696" y="112" font-family="Arial, sans-serif" font-size="21" fill="#172033" font-weight="700">main из библиотеки</text><text x="696" y="145" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">RUN_ALL_TESTS()</text><text x="696" y="173" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">Запуск выбранных тестов</text><text x="30" y="232" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">Регистрация описывает сценарий. Тело теста выполняется при запуске проверок.</text></svg>