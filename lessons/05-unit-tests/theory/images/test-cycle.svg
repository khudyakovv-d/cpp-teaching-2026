<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="275" viewBox="0 0 1000 275" role="img"><title>Тест: данные → действие → проверка</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1000" height="275" rx="16" fill="#f8fafc"/><text x="32" y="42" font-family="Arial, sans-serif" font-size="26" fill="#172033" font-weight="700">Тест: данные → действие → проверка</text><rect x="32" y="88" width="280" height="104" rx="12" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="123" font-family="Arial, sans-serif" font-size="21" fill="#172033" font-weight="700">Подготовить данные</text><text x="50" y="160" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">Сумма 1000, скидка 10%</text><rect x="360" y="88" width="280" height="104" rx="12" fill="#ede9fe" stroke="#cbd5e1" stroke-width="2"/><text x="378" y="123" font-family="Arial, sans-serif" font-size="21" fill="#172033" font-weight="700">Выполнить действие</text><text x="378" y="160" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">Рассчитать стоимость</text><rect x="688" y="88" width="280" height="104" rx="12" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/><text x="706" y="123" font-family="Arial, sans-serif" font-size="21" fill="#172033" font-weight="700">Проверить результат</text><text x="706" y="160" font-family="Arial, sans-serif" font-size="18" fill="#172033" font-weight="400">Ответ должен быть 900</text><path d="M315,140 L350,140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M645,140 L678,140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="237" font-family="Arial, sans-serif" font-size="21" fill="#172033" font-weight="400">После изменения кода повторяем те же проверки — автоматически.</text></svg>