<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img"><title>Пирамида тестирования с ручными проверками</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1000" height="550" rx="16" fill="#f8fafc"/><text x="32" y="42" font-family="Arial, sans-serif" font-size="26" fill="#172033" font-weight="700">Пирамида тестирования</text><polygon points="310,90 245,190 375,190" fill="#fed7aa" stroke="#f8fafc" stroke-width="2"/><polygon points="238,200 382,200 447,300 173,300" fill="#ddd6fe" stroke="#f8fafc" stroke-width="2"/><polygon points="166,310 454,310 519,410 101,410" fill="#bae6fd" stroke="#f8fafc" stroke-width="2"/><polygon points="94,420 526,420 591,520 29,520" fill="#bbf7d0" stroke="#f8fafc" stroke-width="2"/><text x="650" y="140" font-family="Arial, sans-serif" font-size="23" fill="#172033" font-weight="700">Ручное тестирование</text><text x="650" y="171" font-family="Arial, sans-serif" font-size="16" fill="#172033" font-weight="400">Исследование, удобство, новые сценарии</text><path d="M610,135 L638,135" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="250" font-family="Arial, sans-serif" font-size="23" fill="#172033" font-weight="700">e2e-тесты</text><text x="650" y="281" font-family="Arial, sans-serif" font-size="16" fill="#172033" font-weight="400">Основные полные пути пользователя</text><path d="M610,245 L638,245" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="360" font-family="Arial, sans-serif" font-size="23" fill="#172033" font-weight="700">Интеграционные</text><text x="650" y="391" font-family="Arial, sans-serif" font-size="16" fill="#172033" font-weight="400">Взаимодействие частей</text><path d="M610,355 L638,355" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>